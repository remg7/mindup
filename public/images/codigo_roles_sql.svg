<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#9b51e0" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="editorShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .font-body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .font-code { font-family: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace; font-size: 13px; line-height: 22px; }
    
    .ln { fill: #484f58; text-anchor: end; user-select: none; }
    .kwd { fill: #ff7b72; font-weight: 600; }
    .typ { fill: #ffa657; }
    .fn { fill: #d2a8ff; }
    .str { fill: #a5d6ff; }
    .cmt { fill: #8b949e; font-style: italic; }
    .txt { fill: #f0f6fc; }
    .num { fill: #79c0ff; }
    .op { fill: #79c0ff; }

    .tag-admin { fill: #00f2fe; }
    .tag-usuario { fill: #10b981; }
    .tag-auditor { fill: #c084fc; }
  </style>

  <!-- Background Base -->
  <rect width="1400" height="950" fill="#0d1117" />
  <rect width="1400" height="950" fill="url(#bgGlow1)" />
  <rect width="1400" height="950" fill="url(#bgGlow2)" />

  <!-- HEADER -->
  <g transform="translate(60, 35)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#161b22" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />
    <path d="M24 10 a14 14 0 0 1 14 14 c0 7.732-6.268 14-14 14 S10 31.732 10 24 16.268 10 24 10 z" fill="none" stroke="url(#gradHeader)" stroke-width="3" />
    <path d="M24 17 v7 l5 3" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />

    <text x="64" y="24" class="font-title" fill="#f0f6fc" font-size="22">Mind<tspan fill="#00f2fe">UP</tspan> — Base de Datos: Roles, Permisos &amp; RLS (PostgreSQL / Supabase)</text>
    <text x="64" y="44" class="font-body" fill="#8b949e" font-size="13">Archivo: <tspan fill="#4facfe">supabase/schema.sql</tspan> • Buenas Prácticas, Tipado Fuerte y Políticas de Seguridad Row Level</text>

    <!-- Role Badges in Header -->
    <g transform="translate(920, 8)">
      <rect x="0" y="0" width="105" height="32" rx="16" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#00f2fe" />
      <text x="30" y="20" class="font-title" fill="#00f2fe" font-size="11">👑 ADMIN</text>

      <rect x="115" y="0" width="115" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1" />
      <circle cx="131" cy="16" r="4" fill="#10b981" />
      <text x="145" y="20" class="font-title" fill="#10b981" font-size="11">👤 USUARIO</text>

      <rect x="240" y="0" width="120" height="32" rx="16" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" stroke-width="1" />
      <circle cx="256" cy="16" r="4" fill="#c084fc" />
      <text x="270" y="20" class="font-title" fill="#c084fc" font-size="11">🔍 AUDITOR</text>
    </g>
  </g>

  <!-- CODE EDITOR WINDOW -->
  <g transform="translate(60, 110)" filter="url(#editorShadow)">
    <!-- Window Frame -->
    <rect width="1280" height="780" rx="14" fill="#161b22" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <!-- Window Topbar -->
    <path d="M 0 14 Q 0 0 14 0 L 1266 0 Q 1280 0 1280 14 L 1280 44 L 0 44 Z" fill="#0d1117" />
    <line x1="0" y1="44" x2="1280" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Traffic Lights -->
    <circle cx="24" cy="22" r="6" fill="#ff5f56" />
    <circle cx="44" cy="22" r="6" fill="#ffbd2e" />
    <circle cx="64" cy="22" r="6" fill="#27c93f" />

    <!-- Tab -->
    <g transform="translate(95, 8)">
      <rect width="210" height="36" rx="8" fill="#161b22" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#00f2fe" />
      <text x="32" y="22" class="font-title" fill="#f0f6fc" font-size="12">supabase/schema.sql</text>
      <path d="M 190 14 L 198 22 M 198 14 L 190 22" stroke="#8b949e" stroke-width="1.5" />
    </g>

    <!-- Side Highlight Badges -->
    <g transform="translate(980, 70)">
      <rect width="270" height="110" rx="10" fill="#0d1117" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
      <text x="16" y="24" class="font-title" fill="#00f2fe" font-size="12">1. DEFINICIÓN DE ROLES</text>
      <text x="16" y="48" class="font-body" fill="#8b949e" font-size="11">Tipo ENUM con los 3 roles</text>
      <text x="16" y="66" class="font-body" fill="#8b949e" font-size="11">estrictos: <tspan fill="#f0f6fc">admin, usuario, auditor</tspan></text>
      <text x="16" y="90" class="font-body" fill="#10b981" font-size="11">✔ Tipado seguro en BD</text>
    </g>

    <g transform="translate(980, 200)">
      <rect width="270" height="135" rx="10" fill="#0d1117" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="16" y="24" class="font-title" fill="#10b981" font-size="12">2. POLÍTICAS RLS USUARIO</text>
      <text x="16" y="48" class="font-body" fill="#8b949e" font-size="11">Filtro estricto por sesión:</text>
      <text x="16" y="68" class="font-code" fill="#a5d6ff" font-size="11">auth.uid() = usuario_id</text>
      <text x="16" y="92" class="font-body" fill="#8b949e" font-size="11">Aislamiento total: cada usuario</text>
      <text x="16" y="110" class="font-body" fill="#8b949e" font-size="11">solo ve sus propios registros.</text>
    </g>

    <g transform="translate(980, 355)">
      <rect width="270" height="135" rx="10" fill="#0d1117" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
      <text x="16" y="24" class="font-title" fill="#00f2fe" font-size="12">3. POLÍTICAS RLS ADMIN</text>
      <text x="16" y="48" class="font-body" fill="#8b949e" font-size="11">Comprobación con función:</text>
      <text x="16" y="68" class="font-code" fill="#00f2fe" font-size="11">public.is_admin()</text>
      <text x="16" y="92" class="font-body" fill="#8b949e" font-size="11">Control total CRUD sobre diarios,</text>
      <text x="16" y="110" class="font-body" fill="#8b949e" font-size="11">ánimos y perfiles de usuario.</text>
    </g>

    <g transform="translate(980, 510)">
      <rect width="270" height="145" rx="10" fill="#0d1117" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <text x="16" y="24" class="font-title" fill="#c084fc" font-size="12">4. POLÍTICAS RLS AUDITOR</text>
      <text x="16" y="48" class="font-body" fill="#8b949e" font-size="11">Inspección de Solo Lectura:</text>
      <text x="16" y="68" class="font-code" fill="#c084fc" font-size="11">FOR SELECT USING(is_auditor())</text>
      <text x="16" y="92" class="font-body" fill="#8b949e" font-size="11">Garantiza inmutabilidad:</text>
      <text x="16" y="110" class="font-body" fill="#f87171" font-size="11">🚫 INSERT/UPDATE/DELETE bloqueados</text>
      <text x="16" y="128" class="font-body" fill="#10b981" font-size="11">✔ Trazabilidad en audit_logs</text>
    </g>

    <!-- Code Content Area -->
    <g transform="translate(30, 75)" class="font-code">
      <!-- Line Numbers & Code Lines -->
      <text x="25" y="0" class="ln">1</text>
      <text x="45" y="0"><tspan class="cmt">-- 1. DEFINICIÓN DE ROLES (RBAC: Admin, Usuario, Auditor)</tspan></text>

      <text x="25" y="22" class="ln">2</text>
      <text x="45" y="22"><tspan class="kwd">CREATE TYPE</tspan><tspan class="txt"> public.user_role </tspan><tspan class="kwd">AS ENUM</tspan><tspan class="txt"> (</tspan><tspan class="str">'admin'</tspan><tspan class="txt">, </tspan><tspan class="str">'usuario'</tspan><tspan class="txt">, </tspan><tspan class="str">'auditor'</tspan><tspan class="txt">);</tspan></text>

      <text x="25" y="44" class="ln">3</text>
      <text x="45" y="44"></text>

      <text x="25" y="66" class="ln">4</text>
      <text x="45" y="66"><tspan class="cmt">-- 2. TABLA PERFILES CON ASIGNACIÓN DE ROL</tspan></text>

      <text x="25" y="88" class="ln">5</text>
      <text x="45" y="88"><tspan class="kwd">CREATE TABLE</tspan><tspan class="txt"> public.perfiles (</tspan></text>

      <text x="25" y="110" class="ln">6</text>
      <text x="45" y="110"><tspan class="txt">    id </tspan><tspan class="typ">UUID</tspan><tspan class="kwd"> PRIMARY KEY REFERENCES</tspan><tspan class="txt"> auth.users(id),</tspan></text>

      <text x="25" y="132" class="ln">7</text>
      <text x="45" y="132"><tspan class="txt">    email </tspan><tspan class="typ">TEXT</tspan><tspan class="kwd"> NOT NULL UNIQUE</tspan><tspan class="txt">,</tspan></text>

      <text x="25" y="154" class="ln">8</text>
      <text x="45" y="154"><tspan class="txt">    rol public.user_role </tspan><tspan class="kwd">DEFAULT</tspan><tspan class="str"> 'usuario'</tspan><tspan class="kwd"> NOT NULL</tspan></text>

      <text x="25" y="176" class="ln">9</text>
      <text x="45" y="176"><tspan class="txt">);</tspan></text>

      <text x="25" y="198" class="ln">10</text>
      <text x="45" y="198"></text>

      <text x="25" y="220" class="ln">11</text>
      <text x="45" y="220"><tspan class="cmt">-- =========================================================</tspan></text>

      <text x="25" y="242" class="ln">12</text>
      <text x="45" y="242"><tspan class="cmt">-- 3. POLÍTICAS RLS: ROL USUARIO (Solo ve y edita lo propio)</tspan></text>

      <text x="25" y="264" class="ln">13</text>
      <text x="45" y="264"><tspan class="kwd">CREATE POLICY</tspan><tspan class="str"> "Usuario: Ver solo sus propias entradas"</tspan></text>

      <text x="25" y="286" class="ln">14</text>
      <text x="45" y="286"><tspan class="txt">    </tspan><tspan class="kwd">ON</tspan><tspan class="txt"> public.journal_entries </tspan><tspan class="kwd">FOR SELECT</tspan></text>

      <text x="25" y="308" class="ln">15</text>
      <text x="45" y="308"><tspan class="txt">    </tspan><tspan class="kwd">USING</tspan><tspan class="txt"> (</tspan><tspan class="fn">auth.uid</tspan><tspan class="txt">() </tspan><tspan class="op">=</tspan><tspan class="txt"> usuario_id);</tspan></text>

      <text x="25" y="330" class="ln">16</text>
      <text x="45" y="330"></text>

      <text x="25" y="352" class="ln">17</text>
      <text x="45" y="352"><tspan class="kwd">CREATE POLICY</tspan><tspan class="str"> "Usuario: Crear sus propias entradas"</tspan></text>

      <text x="25" y="374" class="ln">18</text>
      <text x="45" y="374"><tspan class="txt">    </tspan><tspan class="kwd">ON</tspan><tspan class="txt"> public.journal_entries </tspan><tspan class="kwd">FOR INSERT</tspan></text>

      <text x="25" y="396" class="ln">19</text>
      <text x="45" y="396"><tspan class="txt">    </tspan><tspan class="kwd">WITH CHECK</tspan><tspan class="txt"> (</tspan><tspan class="fn">auth.uid</tspan><tspan class="txt">() </tspan><tspan class="op">=</tspan><tspan class="txt"> usuario_id);</tspan></text>

      <text x="25" y="418" class="ln">20</text>
      <text x="45" y="418"></text>

      <text x="25" y="440" class="ln">21</text>
      <text x="45" y="440"><tspan class="cmt">-- =========================================================</tspan></text>

      <text x="25" y="462" class="ln">22</text>
      <text x="45" y="462"><tspan class="cmt">-- 4. POLÍTICAS RLS: ROL ADMIN (Control Total CRUD)</tspan></text>

      <text x="25" y="484" class="ln">23</text>
      <text x="45" y="484"><tspan class="kwd">CREATE POLICY</tspan><tspan class="str"> "Admin: Control total en diarios"</tspan></text>

      <text x="25" y="506" class="ln">24</text>
      <text x="45" y="506"><tspan class="txt">    </tspan><tspan class="kwd">ON</tspan><tspan class="txt"> public.journal_entries </tspan><tspan class="kwd">FOR ALL</tspan></text>

      <text x="25" y="528" class="ln">25</text>
      <text x="45" y="528"><tspan class="txt">    </tspan><tspan class="kwd">USING</tspan><tspan class="txt"> (public.</tspan><tspan class="fn">is_admin</tspan><tspan class="txt">()) </tspan><tspan class="kwd">WITH CHECK</tspan><tspan class="txt"> (public.</tspan><tspan class="fn">is_admin</tspan><tspan class="txt">());</tspan></text>

      <text x="25" y="550" class="ln">26</text>
      <text x="45" y="550"></text>

      <text x="25" y="572" class="ln">27</text>
      <text x="45" y="572"><tspan class="cmt">-- =========================================================</tspan></text>

      <text x="25" y="594" class="ln">28</text>
      <text x="45" y="594"><tspan class="cmt">-- 5. POLÍTICAS RLS: ROL AUDITOR (Inspección Solo Lectura)</tspan></text>

      <text x="25" y="616" class="ln">29</text>
      <text x="45" y="616"><tspan class="kwd">CREATE POLICY</tspan><tspan class="str"> "Auditor: Inspección de solo lectura"</tspan></text>

      <text x="25" y="638" class="ln">30</text>
      <text x="45" y="638"><tspan class="txt">    </tspan><tspan class="kwd">ON</tspan><tspan class="txt"> public.journal_entries </tspan><tspan class="kwd">FOR SELECT</tspan></text>

      <text x="25" y="660" class="ln">31</text>
      <text x="45" y="660"><tspan class="txt">    </tspan><tspan class="kwd">USING</tspan><tspan class="txt"> (public.</tspan><tspan class="fn">is_auditor</tspan><tspan class="txt">());</tspan></text>

      <text x="25" y="682" class="ln">32</text>
      <text x="45" y="682"></text>
    </g>
  </g>
</svg>
